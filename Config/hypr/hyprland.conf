 # =============================================================================
# БАЗОВЫЙ КОНФИГ HYPRLAND (GOTO NIXOS)
# =============================================================================
# Настройка монитора (автоматическое разрешение и герцовка)
monitor=,preferred,auto,1

exec-once = ~/.config/hypr/restart_waybar.sh
#exec-once = awww-daemon
exec-once = mako
#exec-once = mpvpaper -o "no-audio --loop --hwdec=no --cache=no" "*" /home/goto/Videos/wallpaper/kurumi.1920x1080.mp4
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = sxystemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = hash dbus-update-activation-environment 2>/dev/null && dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = kitty --title cava_bg -e cava
exec-once = ags run

# Настройка ввода и раскладки клавиатуры
input {
    kb_layout = us,ru
    follow_mouse = 1

    touchpad {
        natural_scroll = false
    }
}


# Внешний вид окон (размытие, границы, анимации)
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33cceeee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 1
    }
}

# Анимации (то самое плавное скольжение из ТикТока)
animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    #animation = windowsOut, 1, 7, default, popup 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

# Отключаем рамки, тени и размытие для всех панелей Waybar
hl.window_rule({ match = { class = "waybar" }, border = false })
hl.window_rule({ match = { class = "waybar" }, shadow = false })

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# Размытие фона для виджетов AGS (V2 синтаксис)
layerrule = match:namespace ags, blur on
layerrule = match:namespace ags, ignore_alpha 0.6

# Превращаем стандартное окно AGS в плавающий оверлей
windowrule = match:class .*equalizer-widget.*, float on
windowrule = match:class .*equalizer-widget.*, pin on
windowrule = match:class .*equalizer-widget.*, border_size 0
windowrule = match:class .*equalizer-widget.*, no_shadow true
layerrule = match:namespace ags-bar, blur on
layerrule = match:namespace ags-bar, ignore_alpha 0.6


# =============================================================================
# ГОРЯЧИЕ КЛАВИШИ (БИНДЫ)
# =============================================================================

# Основной модификатор: SUPER (клавиша Win)
$mainMod = SUPER
# Управление окнами и терминалом
bind = $mainMod, Q, exec, kitty
bind = $mainMod, E, exec, thunar
bind = $mainMod, C, exec, subl
bind = $mainMod, Z, exec, firefox
bind = $mainMod, X, killactive,
bind = $mainMod, M, exit,                      # Выйти из Hyprland в SDDM
bind = $mainMod, V, togglefloating,
bind = SUPER, D, exec, wofi --show drun --allow-images --style ~/.config/wofi/style.css

# Переключение фокуса между окнами (стрелочками)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Переключение рабочих столов (Воркспэйсов)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Перенос активного окна на другой рабочий стол
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Управление окнами с помощью мыши (Зажми Super + ЛКМ/ПКМ)
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Свернуть текущее окно (тихо убрать в специальный воркспейс "minimized")
bind = $mainMod, H, movetoworkspacesilent, special:minimized

# Показать/скрыть все свернутые окна поверх текущего стола
bind = $mainMod SHIFT, H, togglespecialworkspace, minimized

device {
    name = by-tech-gaming-keyboard
    kb_layout = us,ru
    kb_options = grp:win_space_toggle
}

device {
    name = by-tech-gaming-keyboard-1
    kb_layout = us,ru
    kb_options = grp:win_space_toggle
}

# Делаем скриншот области и отправляем его прямо в буфер обмена (в формате PNG)
bind = , Prior, exec, grim -g "$(slurp)" - | swappy -f -
bind = SUPER SHIFT, R, exec, ~/.config/hypr/restart_waybar.sh
bind = SUPER SHIFT, S, exec, systemctl suspend
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, A, exec, ags quit; ags run & 
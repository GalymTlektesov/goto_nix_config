 # =============================================================================
# БАЗОВЫЙ КОНФИГ HYPRLAND (GOTO NIXOS)
# =============================================================================
# Настройка монитора (автоматическое разрешение и герцовка)
monitor=,preferred,auto,1

#exec-once = ~/.config/hypr/restart_waybar.sh
exec-once = awww-daemon
exec-once = awww img /home/goto/Pictures/Wallpaper/main.jpg
exec-once = mako
#exec-once = caelestia-shell
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start hyprland-session.target
exec-once = gslapper -o "loop" "*" /home/goto/Videos/wallpaper/main4.webm
exec-once = nwg-dock-hyprland -p left -a start -i 26 -mb 0 -ml 0 -mt 0 -r -nolauncher -x
exec-once = ags run

# Настройка ввода и раскладки клавиатуры
input {
    kb_layout = us,ru
    follow_mouse = 1

    touchpad {
        natural_scroll = false
    }
}


# Внешний вид окон (размытие, границы, анимации)
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(33cceeee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    layout = dwindle
}
monitor=,addreserved,30,0,0,0

decoration {
    rounding = 10
    blur {
        enabled = true
        size = 3
        passes = 3
    }
}


animations {
    enabled = true
    bezier = myBezier, 0.05, 0.9, 0.1, 1.05
    animation = windows, 1, 7, myBezier
    #animation = windowsOut, 1, 7, default, popup 80%
    animation = border, 1, 10, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
}

env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

#курсор
env = XCURSOR_THEME, Moga-Neon-Purple
env = XCURSOR_SIZE, 24

# Размытие фона для виджетов AGS (V2 синтаксис)
layerrule = match:namespace ags, blur on
layerrule = match:namespace ags, ignore_alpha 0.6

# Превращаем стандартное окно AGS в плавающий оверлей
windowrule = match:class .*equalizer-widget.*, float on
windowrule = match:class .*equalizer-widget.*, pin on
windowrule = match:class .*equalizer-widget.*, border_size 0
windowrule = match:class .*equalizer-widget.*, no_shadow true
layerrule = match:namespace ags-bar, blur on
layerrule = match:namespace ags-bar, ignore_alpha 0.6

layerrule = match:namespace ags-equalize, blur off

# Размытие и игнорирование прозрачных пикселей для nwg-dock
layerrule = match:namespace nwg-dock, blur on
layerrule = match:namespace nwg-dock, ignore_alpha 0.35


#windowrule = match:class .*kitty.*, no_blur on


windowrule = match:class .*thunar.*, opacity 0.9 override 0.7 override

# =============================================================================
# ГОРЯЧИЕ КЛАВИШИ (БИНДЫ)
# =============================================================================
# Управление окнами и терминалом
bind = SUPER, Q, exec, kitty
bind = SUPER, E, exec, thunar
bind = SUPER, C, exec, subl
bind = SUPER, Z, exec, firefox
bind = SUPER, X, killactive,
bind = SUPER SHIFT, L, exit,                      # Выйти из Hyprland в SDDM
bind = SUPER, V, togglefloating,
bind = SUPER, D, exec, wofi --show drun --allow-images --style ~/.config/wofi/style.css

# Переключение фокуса между окнами (стрелочками)
bind = SUPER, left, movefocus, l
bind = SUPER, right, movefocus, r
bind = SUPER, up, movefocus, u
bind = SUPER, down, movefocus, d

# Переключение рабочих столов (Воркспэйсов)
bind = SUPER, 1, workspace, 1
bind = SUPER, 2, workspace, 2
bind = SUPER, 3, workspace, 3
bind = SUPER, 4, workspace, 4
bind = SUPER, 5, workspace, 5
bind = SUPER, 6, workspace, 6
bind = SUPER, 7, workspace, 7
bind = SUPER, 8, workspace, 8
bind = SUPER, 9, workspace, 9
bind = SUPER, 0, workspace, 10

# Перенос активного окна на другой рабочий стол
bind = SUPER SHIFT, 1, movetoworkspace, 1
bind = SUPER SHIFT, 2, movetoworkspace, 2
bind = SUPER SHIFT, 3, movetoworkspace, 3
bind = SUPER SHIFT, 4, movetoworkspace, 4
bind = SUPER SHIFT, 5, movetoworkspace, 5
bind = SUPER SHIFT, 6, movetoworkspace, 6
bind = SUPER SHIFT, 7, movetoworkspace, 7
bind = SUPER SHIFT, 8, movetoworkspace, 8
bind = SUPER SHIFT, 9, movetoworkspace, 9
bind = SUPER SHIFT, 0, movetoworkspace, 10

# Управление окнами с помощью мыши (Зажми Super + ЛКМ/ПКМ)
bindm = SUPER, mouse:272, movewindow
bindm = SUPER, mouse:273, resizewindow

# Свернуть текущее окно (тихо убрать в специальный воркспейс "minimized")
#bind = mainMod, H, movetoworkspacesilent, special:minimized

# Показать/скрыть все свернутые окна поверх текущего стола
#bind = mainMod SHIFT, H, togglespecialworkspace, minimized

device {
    name = by-tech-gaming-keyboard
    kb_layout = us,ru
    kb_options = grp:win_space_toggle
}

device {
    name = by-tech-gaming-keyboard-1
    kb_layout = us,ru
    kb_options = grp:win_space_toggle
}

# Делаем скриншот области и отправляем его прямо в буфер обмена (в формате PNG)
bind = , Prior, exec, grim -g "$(slurp)" - | swappy -f -
bind = Alt, Prior, exec, grim -g "$(slurp)" - | wl-copy
bind = SUPER SHIFT, R, exec, ~/.config/hypr/restart_waybar.sh
bind = SUPER SHIFT, S, exec, systemctl suspend
bind = SUPER, F, fullscreen, 0
bind = SUPER, A, exec, ags quit; ags run & 
bind = SUPER, S, exec, pwvucontrol
bind = SUPER, N, exec, gnome-calculator